name = "uv-web-viewer-pipe"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# No secrets: the Worker has no token (owner decision 2026-10-21). Guards are
# public-IPv4:443 only and max 4 concurrent pipes per client IP.

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "ConnLimiter"

# SQLite-backed Durable Objects are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConnLimiter"]

# Workers Logs would record request headers and client IPs. Keep persistent logs off;
# use `wrangler tail --format pretty` only.
[observability]
enabled = false
