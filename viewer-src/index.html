<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow">
    <title>UV Web Viewer</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      html, body { height: 100%; }
      body { margin: 0; }
      #app { display: flex; flex-direction: column; min-height: 100%; height: 100dvh; box-sizing: border-box;
             padding: max(8px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
                      max(8px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); gap: 6px; }
      h1 { font-size: 1.1rem; margin: 0; }
      .connected h1 { display: none; }
      header.top { display: flex; flex-direction: column; gap: 8px; flex: none; }
      form { display: flex; flex-direction: column; gap: 10px; max-width: 420px; }
      form[hidden] { display: none; }
      label { display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem; }
      label.check { flex-direction: row; align-items: center; gap: 8px; }
      input:not([type="checkbox"]) { font-size: 16px; padding: 8px; box-sizing: border-box; width: 100%; }
      .row { display: flex; gap: 8px; }
      .row button { flex: 1; }
      button { font-size: 1rem; padding: 10px 12px; }
      button.secondary { font-size: 0.85rem; padding: 6px 10px; align-self: flex-start; }
      #status { font-weight: 600; margin: 0; }
      #stage { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 240px; gap: 6px; }
      #stage:fullscreen { background: #000; color: #eee; padding: 4px; box-sizing: border-box; }
      .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; flex: none; }
      .toolbar[hidden] { display: none; }
      .toolbar label { flex-direction: row; align-items: center; gap: 4px; font-size: 0.85rem; }
      .toolbar button, .toolbar select, .toolbar summary { font-size: 0.85rem; padding: 6px 10px; }
      .toolbar button[aria-pressed="true"] { font-weight: 600; outline: 2px solid currentColor; outline-offset: -2px; }
      .toolbar .danger { color: #c62828; }
      .menu { position: relative; }
      .menu summary { cursor: pointer; list-style: none; border: 1px solid rgba(127, 127, 127, 0.6); border-radius: 4px; }
      .menu summary::-webkit-details-marker { display: none; }
      .menu-items { position: absolute; z-index: 10; top: 100%; left: 0; width: max-content; max-width: 80vw; display: flex; flex-direction: column; gap: 4px;
                    padding: 6px; background: Canvas; border: 1px solid rgba(127, 127, 127, 0.6); border-radius: 4px; }
      #notice { margin: 0; padding: 6px 10px; font-size: 0.85rem; background: rgba(255, 193, 7, 0.2); border-radius: 4px; flex: none; }
      #notice[hidden] { display: none; }
      #env-notice { margin: 6px 0; padding: 6px 10px; font-size: 0.85rem; background: rgba(220, 53, 69, 0.2); border-radius: 4px; }
      #env-notice[hidden] { display: none; }
      /* The screen area takes every touch (trackpad mode); the rest of the page scrolls and zooms normally. */
      .viewport { position: relative; flex: 1 1 auto; min-height: 0; background: #000; overflow: hidden; touch-action: none; }
      .viewport[data-scale="actual"] { overflow: auto; }
      /* Screen + overlay wrapper: the local pinch-zoom transform (touch.ts ViewZoom) goes here. */
      .zoom { position: relative; width: 100%; height: 100%; transform-origin: 0 0; }
      .viewport[data-scale="actual"] .zoom { width: max-content; height: max-content; }
      #screen { display: block; object-fit: contain; touch-action: none; user-select: none; -webkit-user-select: none; }
      /* Remote pointer overlay: sized and placed by CursorLayer, never takes pointer events. */
      #cursor-layer { display: block; pointer-events: none; }
      /* Controlling with a known remote pointer shape: the browser cursor would be a second pointer. */
      .viewport.controlling, .viewport.controlling #screen { cursor: none; }
      /* Keyboard focus target laid over the screen; pointer events go through to the canvas. */
      #keyboard-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none;
                        resize: none; border: 0; padding: 0; margin: 0; font-size: 16px; color: transparent;
                        background: transparent; caret-color: transparent; }
      /* Uncommitted IME text, shown locally near the last click (the remote caret); never sent. */
      .composition { position: absolute; left: 8px; top: 8px; z-index: 2; pointer-events: none; max-width: calc(100% - 16px);
                     overflow: hidden; white-space: pre; padding: 2px 6px; border-radius: 4px; font-size: 16px;
                     background: rgba(20, 20, 20, 0.85); color: #fff; text-decoration: underline; }
      .composition[hidden] { display: none; }
      /* Floating ⌨ / Phím on touch devices (coarse pointer, or after a first touch), bottom-right
         inside the safe area, under the toolbar's reach. */
      .touch-buttons { position: fixed; z-index: 5; display: none; gap: 10px;
                       right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); }
      .touch-buttons button { min-width: 48px; min-height: 48px; padding: 8px 12px; font-size: 1.1rem; border-radius: 24px;
                              border: 1px solid rgba(255, 255, 255, 0.5); background: rgba(20, 20, 20, 0.7); color: #fff;
                              touch-action: manipulation; -webkit-user-select: none; user-select: none; }
      .connected .touch-buttons.touch-seen { display: flex; }
      @media (pointer: coarse) { .connected .touch-buttons { display: flex; } }
      /* Chat: desktop = panel on the right of the stage; coarse pointer (phone/tablet, as touch.ts) or narrow = bottom sheet. */
      #stage { position: relative; }
      .toolbar .badge { display: inline-block; min-width: 1.2em; padding: 0 5px; margin-left: 2px; border-radius: 10px;
                        background: #d32f2f; color: #fff; font-size: 0.75rem; font-weight: 600; text-align: center; }
      .toolbar .badge[hidden] { display: none; }
      .chat-panel { position: absolute; z-index: 20; top: var(--chat-top, 0); right: 0; bottom: 0; width: min(360px, 100%); box-sizing: border-box;
                    display: flex; flex-direction: column; background: Canvas; color: CanvasText;
                    border-left: 1px solid rgba(127, 127, 127, 0.5); box-shadow: -4px 0 16px rgba(0, 0, 0, 0.25); }
      .chat-panel[hidden] { display: none; }
      .chat-head { display: flex; align-items: center; gap: 6px; padding: 6px; border-bottom: 1px solid rgba(127, 127, 127, 0.35); flex: none; }
      .chat-tabs { display: flex; gap: 4px; flex: 1; }
      .chat-tab, .chat-close { font-size: 0.85rem; padding: 6px 10px; }
      .chat-tab[aria-selected="true"] { font-weight: 600; outline: 2px solid currentColor; outline-offset: -2px; }
      .chat-pane { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
      .chat-pane[hidden] { display: none; }
      .chat-transcript, .clip-list { list-style: none; margin: 0; padding: 8px; overflow-y: auto; flex: 1 1 auto; min-height: 0;
                                     display: flex; flex-direction: column; gap: 8px; }
      .chat-message { max-width: 85%; padding: 6px 10px; border-radius: 10px; background: rgba(127, 127, 127, 0.15); align-self: flex-start; }
      .chat-message.outgoing { align-self: flex-end; background: rgba(33, 150, 243, 0.25); }
      .chat-text, .clip-text { white-space: pre-wrap; word-break: break-word; font-size: 0.9rem; }
      .chat-meta, .clip-meta { font-size: 0.7rem; opacity: 0.7; margin-top: 2px; }
      .chat-typing, .chat-unavailable, .chat-error, .clip-empty { margin: 0; padding: 4px 10px; font-size: 0.8rem; flex: none; }
      .chat-typing { font-style: italic; opacity: 0.8; }
      .chat-error { color: #c62828; }
      .chat-typing[hidden], .chat-unavailable[hidden], .chat-error[hidden], .clip-empty[hidden] { display: none; }
      .chat-compose { display: flex; gap: 6px; padding: 6px; border-top: 1px solid rgba(127, 127, 127, 0.35); flex: none; }
      .chat-input { flex: 1; resize: none; font: inherit; font-size: 16px; padding: 6px; box-sizing: border-box; }
      .chat-send { flex: none; }
      .chat-attach { flex: none; font-size: 1rem; padding: 4px 8px; }
      /* File cards (in the chat transcript) and the drop overlay (chat panel and screen). */
      .file-card { width: 92%; box-sizing: border-box; padding: 8px 10px; border-radius: 10px; background: rgba(127, 127, 127, 0.15); display: flex; flex-direction: column; gap: 4px; }
      .file-card.outgoing { align-self: flex-end; background: rgba(33, 150, 243, 0.25); }
      .file-card.incoming { align-self: flex-start; }
      .file-name { font-size: 0.9rem; font-weight: 600; word-break: break-all; }
      .file-meta, .file-status, .file-note { font-size: 0.75rem; opacity: 0.85; }
      .file-note { color: #c62828; opacity: 1; }
      .file-card[data-state="failed"] .file-status { color: #c62828; opacity: 1; }
      .file-bar { width: 100%; height: 8px; }
      .file-actions { display: flex; gap: 6px; justify-content: flex-end; }
      .file-actions button { font-size: 0.8rem; padding: 4px 10px; }
      .file-card [hidden] { display: none; }
      .drop-overlay { position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; text-align: center;
                      padding: 16px; box-sizing: border-box; font-size: 1.1rem; font-weight: 600; pointer-events: none;
                      background: rgba(33, 150, 243, 0.35); color: #fff; border: 3px dashed #fff; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7); }
      .drop-overlay[hidden] { display: none; }
      .clip-entry { padding: 6px 8px; border-radius: 8px; background: rgba(127, 127, 127, 0.12); display: flex; flex-direction: column; gap: 4px; }
      .clip-entry .clip-text { max-height: 6.5em; overflow: hidden; }
      .clip-copy { align-self: flex-end; font-size: 0.8rem; padding: 4px 10px; }
      @media (pointer: coarse), (max-width: 600px) {
        .chat-panel { position: fixed; top: auto; left: 0; right: 0; width: auto; height: min(70dvh, 560px);
                      border-left: 0; border-top: 1px solid rgba(127, 127, 127, 0.5); border-radius: 12px 12px 0 0;
                      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.3);
                      padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      }
      /* Clipboard notices; the "Sao chép" button writes inside its own click when the browser refused. */
      .toast { position: absolute; z-index: 25; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: calc(100% - 32px);
               display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem;
               background: rgba(20, 20, 20, 0.9); color: #fff; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35); }
      .toast[hidden], .toast button[hidden] { display: none; }
      .toast button { font-size: 0.85rem; padding: 4px 10px; }
      .capture-toast { bottom: 64px; }
      /* Screenshot annotator: a full-page modal; the canvas takes every touch (drawing), buttons stay finger-sized. */
      .cap-modal { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; box-sizing: border-box;
                   background: #0c0c0c; color: #fff; touch-action: none;
                   padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right))
                            max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); gap: 8px; }
      .cap-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; flex: none; }
      .cap-group { display: flex; flex-wrap: wrap; gap: 6px; }
      .cap-modal button { font-size: 0.95rem; min-height: 40px; padding: 6px 12px; touch-action: manipulation; }
      .cap-modal button[aria-pressed="true"] { font-weight: 600; outline: 2px solid #fff; outline-offset: -2px; }
      .cap-ink { width: 40px; min-width: 40px; border-radius: 50%; background: var(--ink); border: 2px solid rgba(255, 255, 255, 0.6); padding: 0; }
      .cap-stage { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
      .cap-canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; background: #000; }
      .cap-foot { justify-content: flex-start; }
      .cap-spacer { flex: 1; }
      .cap-size { font-size: 0.85rem; opacity: 0.85; }
      .cap-error { margin: 0; font-size: 0.85rem; color: #ff8a80; flex: none; }
      .cap-error[hidden] { display: none; }
      details#diagnostics { flex: none; }
      details#diagnostics label, details#diagnostics button { margin-top: 8px; }
      #stats { font-size: 0.8rem; opacity: 0.75; margin: 4px 0; min-height: 1em; }
      #log { font-size: 0.75rem; white-space: pre-wrap; word-break: break-word; max-height: 30vh; overflow: auto;
             background: rgba(127, 127, 127, 0.12); padding: 8px; margin: 8px 0 0; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
