<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow">
    <title>UV Web Viewer</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      html, body { height: 100%; }
      body { margin: 0; }
      #app { display: flex; flex-direction: column; min-height: 100%; height: 100dvh; box-sizing: border-box;
             padding: 8px 16px; gap: 6px; }
      h1 { font-size: 1.1rem; margin: 0; }
      .connected h1 { display: none; }
      header.top { display: flex; flex-direction: column; gap: 8px; flex: none; }
      form { display: flex; flex-direction: column; gap: 10px; max-width: 420px; }
      form[hidden] { display: none; }
      label { display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem; }
      label.check { flex-direction: row; align-items: center; gap: 8px; }
      input:not([type="checkbox"]) { font-size: 16px; padding: 8px; box-sizing: border-box; width: 100%; }
      .row { display: flex; gap: 8px; }
      .row button { flex: 1; }
      button { font-size: 1rem; padding: 10px 12px; }
      button.secondary { font-size: 0.85rem; padding: 6px 10px; align-self: flex-start; }
      #status { font-weight: 600; margin: 0; }
      #stage { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 240px; gap: 6px; }
      #stage:fullscreen { background: #000; color: #eee; padding: 4px; box-sizing: border-box; }
      .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; flex: none; }
      .toolbar[hidden] { display: none; }
      .toolbar label { flex-direction: row; align-items: center; gap: 4px; font-size: 0.85rem; }
      .toolbar button, .toolbar select, .toolbar summary { font-size: 0.85rem; padding: 6px 10px; }
      .toolbar button[aria-pressed="true"] { font-weight: 600; outline: 2px solid currentColor; outline-offset: -2px; }
      .toolbar .danger { color: #c62828; }
      .menu { position: relative; }
      .menu summary { cursor: pointer; list-style: none; border: 1px solid rgba(127, 127, 127, 0.6); border-radius: 4px; }
      .menu summary::-webkit-details-marker { display: none; }
      .menu-items { position: absolute; z-index: 10; top: 100%; left: 0; display: flex; flex-direction: column; gap: 4px;
                    padding: 6px; background: Canvas; border: 1px solid rgba(127, 127, 127, 0.6); border-radius: 4px; }
      #notice { margin: 0; padding: 6px 10px; font-size: 0.85rem; background: rgba(255, 193, 7, 0.2); border-radius: 4px; flex: none; }
      #notice[hidden] { display: none; }
      .viewport { position: relative; flex: 1 1 auto; min-height: 0; background: #000; overflow: hidden; }
      .viewport[data-scale="actual"] { overflow: auto; }
      #screen { display: block; object-fit: contain; touch-action: none; user-select: none; -webkit-user-select: none; }
      /* Remote pointer overlay: sized and placed by CursorLayer, never takes pointer events. */
      #cursor-layer { display: block; pointer-events: none; }
      /* Controlling with a known remote pointer shape: the browser cursor would be a second pointer. */
      .viewport.controlling, .viewport.controlling #screen { cursor: none; }
      /* Keyboard focus target laid over the screen; pointer events go through to the canvas. */
      #keyboard-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none;
                        resize: none; border: 0; padding: 0; margin: 0; font-size: 16px; color: transparent;
                        background: transparent; caret-color: transparent; }
      /* Uncommitted IME text, shown locally near the last click (the remote caret); never sent. */
      .composition { position: absolute; left: 8px; top: 8px; z-index: 2; pointer-events: none; max-width: calc(100% - 16px);
                     overflow: hidden; white-space: pre; padding: 2px 6px; border-radius: 4px; font-size: 16px;
                     background: rgba(20, 20, 20, 0.85); color: #fff; text-decoration: underline; }
      .composition[hidden] { display: none; }
      details#diagnostics { flex: none; }
      details#diagnostics label, details#diagnostics button { margin-top: 8px; }
      #stats { font-size: 0.8rem; opacity: 0.75; margin: 4px 0; min-height: 1em; }
      #log { font-size: 0.75rem; white-space: pre-wrap; word-break: break-word; max-height: 30vh; overflow: auto;
             background: rgba(127, 127, 127, 0.12); padding: 8px; margin: 8px 0 0; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
